# =============================================================================
# projects.yaml - Project Manifest for Ideon Scraping
# =============================================================================
# This file is the single source of truth for all scraping project metadata.
# Use tools/project_registry.py to query this data programmatically.
#
# Usage:
#   python tools/project_registry.py list --site-type sapphire
#   python tools/project_registry.py list --state TX
#   python tools/project_registry.py list --coverage medicaid
#   python tools/project_registry.py list --status not_implemented
# =============================================================================

# -----------------------------------------------------------------------------
# Site Type Definitions
# -----------------------------------------------------------------------------
site_types:
  carrier: "Direct REST API integration - custom endpoints per carrier"
  healthsparq: "HealthSparq platform - use 'python -m healthsparq' CLI"
  sapphire: "ProviderFinderOnline/Sapphire platform - standardized API"
  anthem: "Wellpoint/Anthem infrastructure - multi-phase with filtering"
  healthtrioconnect: "Node.js + Python hybrid - browser automation"
  werally: "UHC/Werally platform - grid-based geographic search"
  provider_lenz: "Anti-bot protected - requires captcha solving"

# -----------------------------------------------------------------------------
# Coverage Type Definitions
# -----------------------------------------------------------------------------
coverage_types:
  medicare_advantage: "Senior plans (65+)"
  medicaid: "State-funded programs"
  aca: "ACA Marketplace plans"
  large_group: "Employer-sponsored plans"

# -----------------------------------------------------------------------------
# Status Definitions
# -----------------------------------------------------------------------------
# active: Implemented and running
# not_implemented: In CSV/planned but no code yet
# archived: Previously active, now deprecated

# -----------------------------------------------------------------------------
# Project Registry
# -----------------------------------------------------------------------------
