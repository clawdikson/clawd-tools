# BCBS Montana Sapphire Configuration
# Migrated from audiobee_bcbs_mt/config.py

project:
    name: BCBS Montana
    slug: bcbs_mt
    description: Blue Cross Blue Shield of Montana provider directory

site:
    domain: my.providerfinderonline.com
    ci: MT-UUX
    config_signature: "{1292}-{1397|114}-{}"
    api_version: v1

# Networks from data/networks.json (primary ones enabled)
networks:
    - id: "210002020"
      name: "All plans/networks"
      state: MT
      enabled: true
    - id: "96"
      name: "Blue Options or Blue Choice Options"
      state: MT
      enabled: true
    - id: "300000045"
      name: "Blue Choice Options"
      state: MT
      enabled: true
    - id: "1000088"
      name: "Blue Choice PPO"
      state: MT
      enabled: true

coverage:
    states: [MT]
    geo_strategy: dual

# Override concurrency for MT (from legacy config)
concurrency:
    max_workers: 1
    max_pages: 2
    batch_size: 5000
    retry_attempts: 5

# Override API common params
api:
    common_params:
        locale: en
        data_language: en
        account_id: "1292"

# Inherit other defaults from _base.yaml
