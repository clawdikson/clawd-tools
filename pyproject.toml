[project]
name = "healthsparq"
version = "1.0.0"
description = "Unified HealthSparq scraper package"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "aiofiles>=23.0.0",
    "orjson>=3.9.0",
    "httpx>=0.24.0",
    "tenacity>=8.2.0",
    "pandas>=2.3.3",
    "browserforge>=1.2.3",
    "google>=3.0.0",
    "google-auth>=2.45.0",
    "dataframe-image>=0.2.3",
    "openpyxl>=3.1.0",
    "matplotlib>=3.7.0",
    "boto3>=1.42.19",
    "xlsxwriter>=3.2.9",
    "py7zr>=1.1.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["healthsparq*"]

[tool.pytest.ini_options]
testpaths = ["healthsparq/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["healthsparq"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
