[project]
name = "healthsparq"
version = "1.0.0"
description = "Unified HealthSparq scraper package"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "aiofiles>=23.0.0",
    "orjson>=3.9.0",
    "httpx>=0.24.0",
    "tenacity>=8.2.0",
    "pandas>=2.3.3",
    "browserforge>=1.2.3",
    "google>=3.0.0",
    "google-auth>=2.45.0",
    "dataframe-image>=0.2.3",
    "openpyxl>=3.1.0",
    "matplotlib>=3.7.0",
    "boto3>=1.42.19",
    "xlsxwriter>=3.2.9",
    "py7zr>=1.1.0",
    "camoufox[geoip]>=0.4.11",
    "ruff>=0.8.0",
    "python-dotenv>=1.2.1",
    "pydantic-settings>=2.12.0",
    "loguru>=0.7.3",
    "patchright>=1.57.2",
    "curl-cffi>=0.14.0",
    "core",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["healthsparq*"]

[tool.pytest.ini_options]
testpaths = ["healthsparq/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["healthsparq"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# =============================================================================
# Ruff - Fast Python Linter & Formatter
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "node_modules",
    "old_code",
    "audiobee_*/20*",  # Date-versioned output directories
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (common in Typer)
    "B905",   # zip without strict= (Python 3.10+ feature)
    "ARG001", # unused function argument (common in callbacks)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["ARG001", "ARG002"]
"**/conftest.py" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["healthsparq", "core", "shared_package"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# Black - Code Formatter (alternative to ruff format)
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | \.egg-info
    | node_modules
    | old_code
    | audiobee_.*/20\d{6}  # Date-versioned output directories
)/
'''

# =============================================================================
# MyPy - Type Checking
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shared_package.*", "core.*"]
ignore_missing_imports = true

[tool.uv.workspace]
members = [
    "core",
]

[tool.uv.sources]
core = { workspace = true }
