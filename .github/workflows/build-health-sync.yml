name: Build Health Sync APK

on:
  push:
    paths:
      - 'health-sync-app/**'
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: health-sync-app
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create gradle wrapper
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ClawdBot-Health-Sync
        path: health-sync-app/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: health-sync-v1.0.${{ github.run_number }}
        name: Health Sync v1.0.${{ github.run_number }}
        files: health-sync-app/app/build/outputs/apk/debug/app-debug.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
