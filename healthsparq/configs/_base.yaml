# Base configuration for all HealthSparq projects.
# Project-specific configs inherit from this and can override any value.

filters:
  provider_types:
    - Facility
    - Group
    - Pharmacy
    - Dental
    - Physician
    - Other

concurrency:
  max_workers: 100
  max_browsers: 1
  request_delay_ms: 0
  retry_attempts: 3
  retry_delay_ms: 1000

output:
  raw_subdir: raw
  processed_subdir: processed
